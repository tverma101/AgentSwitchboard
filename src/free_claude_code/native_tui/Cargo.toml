[package]
name = "fcc-control-center"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native Ratatui control center for AgentSwitchboard"
publish = false

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
