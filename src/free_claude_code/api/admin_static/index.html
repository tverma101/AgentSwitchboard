<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Claude Code Admin</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">FC</div>
          <div>
            <h1>Free Claude Code</h1>
            <p>Server Control</p>
          </div>
        </div>
        <nav id="sectionNav" class="section-nav" aria-label="Admin views"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="pageTitle">Providers</h2>
          </div>
        </header>

        <div id="adminViews" class="admin-views">
          <section id="view-providers" class="admin-view active" data-view="providers">
            <section
              id="connectedAccountsSection"
              class="provider-strip"
              aria-label="Connected accounts"
              hidden
            >
              <div class="strip-header">
                <div>
                  <h3>Connected accounts</h3>
                  <p>Use an existing subscription without storing credentials in .env.</p>
                </div>
              </div>
              <div id="connectedAccountGrid" class="provider-grid"></div>
            </section>
            <section class="provider-strip" aria-label="Provider status">
              <div class="strip-header">
                <h3>Providers</h3>
              </div>
              <div id="providerGrid" class="provider-grid"></div>
            </section>
            <div
              id="providersSections"
              class="form-sections"
              aria-label="Provider configuration"
            ></div>
          </section>

          <section id="view-model_config" class="admin-view" data-view="model_config" hidden>
            <div
              id="modelConfigSections"
              class="form-sections"
              aria-label="Model configuration"
            ></div>
          </section>

          <section id="view-usage" class="admin-view" data-view="usage" hidden>
            <section class="usage-panel" aria-label="Token usage">
              <div class="usage-toolbar">
                <div>
                  <h3>Token usage</h3>
                  <p>Final usage delivered to Claude Code. Prompts and responses are never stored.</p>
                </div>
                <div class="usage-range" role="group" aria-label="Usage range">
                  <button class="secondary-button usage-range-button" data-usage-days="7" type="button">7 days</button>
                  <button class="secondary-button usage-range-button active" data-usage-days="30" type="button">30 days</button>
                  <button class="secondary-button usage-range-button" data-usage-days="90" type="button">90 days</button>
                  <button id="usageRefreshButton" class="secondary-button" type="button">Refresh</button>
                </div>
              </div>
              <div id="usageStats" class="usage-stats"></div>
              <div id="usageChart" class="usage-chart" aria-label="Daily token usage"></div>
              <div id="usageModels" class="usage-models"></div>
            </section>
          </section>

          <section id="view-messaging" class="admin-view" data-view="messaging" hidden>
            <div
              id="messagingSections"
              class="form-sections"
              aria-label="Messaging configuration"
            ></div>
          </section>
        </div>
      </main>

      <footer class="action-bar">
        <div class="action-meta">
          <strong id="dirtyState">No changes</strong>
          <span id="configPath"></span>
        </div>
        <div id="messageArea" class="message-area"></div>
        <div class="action-buttons">
          <button id="validateButton" class="secondary-button" type="button">Validate</button>
          <button id="applyButton" class="primary-button" type="button" disabled>Apply</button>
        </div>
      </footer>
    </div>
    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
