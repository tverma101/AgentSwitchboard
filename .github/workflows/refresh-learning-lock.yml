name: One-shot learning lock refresh

on:
  push:
    branches:
      - feat/claude-learning-memory-skills

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/claude-learning-memory-skills
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: true
      - name: Regenerate lock and remove this one-shot workflow
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git rm .github/workflows/refresh-learning-lock.yml
          git commit -m "chore: regenerate lockfile for 4.20.0"
          git push origin HEAD:feat/claude-learning-memory-skills
