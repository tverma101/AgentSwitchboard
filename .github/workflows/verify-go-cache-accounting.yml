name: One-shot Go cache accounting verifier

on:
  push:
    branches:
      - fix/go-cache-usage-accounting
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/go-cache-usage-accounting
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: true
      - name: Verify cache accounting and regenerate lock
        run: |
          uv lock
          uv run ruff format src/free_claude_code/providers/openai_chat/usage.py src/free_claude_code/core/openai_responses/provider_stream.py tests/providers/test_openai_chat_usage.py tests/core/openai_responses/test_provider_stream.py
          uv run ruff check --fix src/free_claude_code/providers/openai_chat/usage.py src/free_claude_code/core/openai_responses/provider_stream.py tests/providers/test_openai_chat_usage.py tests/core/openai_responses/test_provider_stream.py
          uv run ty check
          uv run pytest -q tests/providers/test_openai_chat_usage.py tests/providers/test_opencode.py tests/core/openai_responses/test_provider_stream.py
      - name: Commit verified generated changes and remove verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock src/free_claude_code/providers/openai_chat/usage.py src/free_claude_code/core/openai_responses/provider_stream.py tests/providers/test_openai_chat_usage.py tests/core/openai_responses/test_provider_stream.py
          git rm .github/workflows/verify-go-cache-accounting.yml
          git commit -m "chore: verify Go cache accounting"
          git push origin HEAD:fix/go-cache-usage-accounting
