name: refresh-base64-pr

on:
  push:
    branches: [fix/base64-image-preflight-bound]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: false
      - name: Merge current main and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AgentSwitchboard audit repair"
          git config user.email "audit-repair@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          uv sync --locked
          uv run ruff format --check src/free_claude_code/core/visual_attachments.py tests/core/test_visual_attachments.py tests/core/test_visual_attachment_preflight_bounds.py
          uv run ruff check src/free_claude_code/core/visual_attachments.py tests/core/test_visual_attachments.py tests/core/test_visual_attachment_preflight_bounds.py
          uv run ty check
          uv run pytest -q -n 0 tests/core/test_visual_attachments.py tests/core/test_visual_attachment_preflight_bounds.py
          git diff --check origin/main...HEAD
          git rm .github/workflows/refresh-base64-pr.yml
          git commit -m "chore: validate base64 repair on current main"
          git push origin HEAD:fix/base64-image-preflight-bound
