name: TUI branch sync

on:
  push:
    branches: [codex/textual-control-center]

concurrency:
  group: tui-branch-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply pinned Harlequin wiring and auth completion copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/free_claude_code/cli/control_tui.py")
          text = path.read_text()
          text = text.replace(
              "from textual.app import App, ComposeResult",
              "from textual.app import ComposeResult",
          )
          marker = "from . import codex_accounts\n"
          insertion = "from . import codex_accounts\nfrom .harlequin_app_base import HarlequinAppBase\n"
          if "from .harlequin_app_base import HarlequinAppBase" not in text:
              text = text.replace(marker, insertion)
          text = text.replace(
              "class ControlCenterApp(App[ControlResult | None]):",
              "class ControlCenterApp(HarlequinAppBase):",
          )
          text = text.replace(
              "table.coordinate_to_cell_key((table.cursor_row, 0))",
              "table.coordinate_to_cell_key(table.cursor_coordinate)",
          )
          path.write_text(text)

          login = Path("src/free_claude_code/providers/openai_codex/login.py")
          login_text = login.read_text()
          login_text = login_text.replace(
              '                    "Connected",\n'
              '                    "OpenAI is connected to Free Claude Code. You can close this tab.",',
              '                    "Authorization received",\n'
              '                    "CodeSwitchyard is finishing sign-in. Return to the terminal for final connection status.",',
          )
          login.write_text(login_text)
          PY
      - name: Lock and normalize transplanted TUI
        run: |
          uv lock
          uv sync --locked --dev
          uv run ruff format \
            src/free_claude_code/cli/control_tui.py \
            src/free_claude_code/cli/control_tui_entry.py \
            src/free_claude_code/cli/entrypoints.py \
            src/free_claude_code/cli/harlequin_app_base.py \
            src/free_claude_code/cli/harlequin_theme.py \
            src/free_claude_code/providers/openai_codex/login.py \
            tests/cli/test_control_tui.py
          uv run ruff check --fix \
            src/free_claude_code/cli/control_tui.py \
            src/free_claude_code/cli/control_tui_entry.py \
            src/free_claude_code/cli/entrypoints.py \
            src/free_claude_code/cli/harlequin_app_base.py \
            src/free_claude_code/cli/harlequin_theme.py \
            src/free_claude_code/providers/openai_codex/login.py \
            tests/cli/test_control_tui.py
          uv run ty check \
            src/free_claude_code/cli/control_tui.py \
            src/free_claude_code/cli/control_tui_entry.py \
            src/free_claude_code/cli/entrypoints.py \
            src/free_claude_code/cli/harlequin_app_base.py \
            src/free_claude_code/cli/harlequin_theme.py \
            src/free_claude_code/providers/openai_codex/login.py \
            tests/cli/test_control_tui.py
          uv run pytest -q tests/cli/test_control_tui.py tests/providers/test_openai_codex_auth.py
      - name: Commit normalized branch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock \
            src/free_claude_code/cli/control_tui.py \
            src/free_claude_code/cli/control_tui_entry.py \
            src/free_claude_code/cli/entrypoints.py \
            src/free_claude_code/cli/harlequin_app_base.py \
            src/free_claude_code/cli/harlequin_theme.py \
            src/free_claude_code/providers/openai_codex/login.py \
            tests/cli/test_control_tui.py
          git commit -m "chore: normalize transplanted Textual control center"
          git push
