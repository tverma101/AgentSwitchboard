name: Reviewer release finalize

on:
  push:
    branches: [feat/auto-reviewer-scar-learning]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: harness-local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/auto-reviewer-scar-learning
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.11.16
          enable-cache: false
      - name: Reuse warm Harness environment
        shell: bash
        run: |
          environment_root="$HOME/.cache/harness-actions/venvs"
          environment_path="$environment_root/${RUNNER_OS}-${RUNNER_ARCH}-py314"
          mkdir -p "$environment_root"
          echo "UV_PROJECT_ENVIRONMENT=$environment_path" >> "$GITHUB_ENV"
          export UV_PROJECT_ENVIRONMENT="$environment_path"
          uv sync --locked
      - name: Finalize docs and release metadata
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
              elif new not in text:
                  raise SystemExit(f"missing expected release fragment in {path}: {old[:80]!r}")

          replace_once("pyproject.toml", 'version = "4.56.0"', 'version = "4.57.0"')
          replace_once("README.md", '`4.56.0`', '`4.57.0`')
          replace_once(
              "docs/CLAUDE_LEARNING.md",
              "When `fcc-claude` starts successfully, FCC idempotently merges five hooks into the active Claude Code `settings.json` while preserving unrelated settings/hooks:",
              "When `fcc-claude` starts successfully, FCC idempotently merges seven hooks into the active Claude Code `settings.json` while preserving unrelated settings/hooks:",
          )
          replace_once(
              "docs/CLAUDE_LEARNING.md",
              "- **UserPromptSubmit**: save the current prompt and inject the most relevant memories using deterministic token overlap + recency scoring.\n- **SubagentStart**: fingerprint the delegated task and inject only the selected compact reviewer-scar slice plus the bounded exit-ticket contract.",
              "- **UserPromptSubmit**: save the current prompt and inject the most relevant memories using deterministic token overlap + recency scoring.\n- **PreToolUse(Agent)**: fingerprint the actual delegated Agent task, select the smallest relevant reviewer packs, and append only the bounded scar slice plus X1/A1 learning contract to that Agent prompt. It does not auto-approve the tool.\n- **PostToolUse(Agent)**: for a completed foreground Agent, validate its X1 result plus optional A1 scar candidate, return the compact result to the parent, and automatically persist only a candidate that passes the existing counterfactual gate. Background launches store only a short-lived metadata-only task plan.\n- **SubagentStart**: retain a small fallback reviewer/exit-ticket contract for direct subagent lifecycle events; task-specific Agent selection is owned by PreToolUse where the real delegated prompt exists.",
          )
          replace_once(
              "docs/CLAUDE_LEARNING.md",
              "Reviewer hooks are advisory and non-critical. A missing or malformed X1 ticket is\nreported to the parent as `UNVERIFIED`; it does not persist the worker message or\nsilently promote a scar. An explicitly supplied candidate must still pass the\nexisting counterfactual admission gate before a caller persists it.",
              "Reviewer hooks are advisory and non-critical. A missing or malformed X1 ticket, a missing/malformed A1 candidate, `learn=0`, failed work, an unselected reviewer pack, mismatched task scope/evidence, or weak verification all default to **DROP**. Foreground Agent results are learned at PostToolUse; background Agent launches keep only hashed session/agent identity plus task fingerprint/pack metadata until SubagentStop. Neither path stores the subagent transcript. A1 may persist only when its pack is task-selected, its condition/rule/evidence bind exactly to X1, and the existing counterfactual admission gate accepts the prevented-pain claim.",
          )
          replace_once(
              "docs/CLAUDE_LEARNING.md",
              "~/.fcc/learning/reviewer-packs.json\n```",
              "~/.fcc/learning/reviewer-packs.json\n~/.fcc/learning/reviewer-pending.json  # short-lived background Agent metadata only\n```",
          )
          PY
          uv lock
          uv run --no-sync ruff format tests/learning/test_auto_reviewer_install.py
          uv run --no-sync ruff check tests/learning/test_auto_reviewer_install.py
          uv run --no-sync ty check \
            src/free_claude_code/learning/auto_reviewer.py \
            src/free_claude_code/learning/hooks.py
      - name: Commit release cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No release cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/CLAUDE_LEARNING.md pyproject.toml uv.lock tests/learning/test_auto_reviewer_install.py
          git commit -m "chore: finalize automatic reviewer learning release"
          git push origin HEAD:feat/auto-reviewer-scar-learning
