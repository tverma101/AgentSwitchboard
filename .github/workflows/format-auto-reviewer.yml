name: Reviewer formatter fix

on:
  push:
    branches: [feat/auto-reviewer-scar-learning]

permissions:
  contents: write

jobs:
  fix:
    runs-on: harness-local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/auto-reviewer-scar-learning
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.11.16
          enable-cache: false
      - name: Reuse warm Harness environment
        shell: bash
        run: |
          environment_root="$HOME/.cache/harness-actions/venvs"
          environment_path="$environment_root/${RUNNER_OS}-${RUNNER_ARCH}-py314"
          mkdir -p "$environment_root"
          echo "UV_PROJECT_ENVIRONMENT=$environment_path" >> "$GITHUB_ENV"
          export UV_PROJECT_ENVIRONMENT="$environment_path"
          uv sync --locked
      - name: Apply diagnosed static fixes
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          path = Path("src/free_claude_code/learning/auto_reviewer.py")
          text = path.read_text()
          replacements = {
              "from contextlib import contextmanager\n": "from contextlib import contextmanager, suppress\n",
              "from pathlib import Path\n": "",
              "from typing import Any, Final\n": "from typing import Final\n",
              '''    base_input = _base_agent_input(raw_input)\n    try:\n        plan = build_reviewer_plan(base_input, profile=profile)\n''': '''    input_mapping = {\n        key: value for key, value in raw_input.items() if isinstance(key, str)\n    }\n    response_mapping = {\n        key: value for key, value in raw_response.items() if isinstance(key, str)\n    }\n    base_input = _base_agent_input(input_mapping)\n    try:\n        plan = build_reviewer_plan(base_input, profile=profile)\n''',
              '    status = raw_response.get("status")\n': '    status = response_mapping.get("status")\n',
              '        agent_id = raw_response.get("agentId")\n': '        agent_id = response_mapping.get("agentId")\n',
              '''        if isinstance(session_id, str) and isinstance(agent_id, str):\n            try:\n                PendingReviewerTasks(profile).save(session_id, agent_id, plan)\n            except OSError, ReviewerScarError:\n                pass\n''': '''        if isinstance(session_id, str) and isinstance(agent_id, str):\n            with suppress(OSError, ReviewerScarError):\n                PendingReviewerTasks(profile).save(session_id, agent_id, plan)\n''',
              '    message = _agent_response_text(raw_response)\n': '    message = _agent_response_text(response_mapping)\n',
              '                    key=lambda item: int(entries[item].get("created_at", 0)),\n': '                    key=lambda item: _created_at(entries[item]),\n',
              '    return hashlib.sha256(f"{session_id}\\0{agent_id}".encode("utf-8")).hexdigest()[:24]\n': '    return hashlib.sha256(f"{session_id}\\0{agent_id}".encode()).hexdigest()[:24]\n',
              '''def _string_tuple(value: object) -> tuple[str, ...]:\n    if not isinstance(value, list) or not all(isinstance(item, str) for item in value):\n        return ()\n    return tuple(value)\n''': '''def _created_at(value: Mapping[str, object]) -> int:\n    created = value.get("created_at")\n    return created if isinstance(created, int) and not isinstance(created, bool) else 0\n\n\ndef _string_tuple(value: object) -> tuple[str, ...]:\n    if not isinstance(value, list):\n        return ()\n    return tuple(item for item in value if isinstance(item, str))\n''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Ruff normalize
        shell: bash
        run: |
          uv run --no-sync ruff format \
            src/free_claude_code/learning/auto_reviewer.py \
            src/free_claude_code/learning/hooks.py \
            tests/learning/test_auto_reviewer.py
          uv run --no-sync ruff check --fix \
            src/free_claude_code/learning/auto_reviewer.py \
            src/free_claude_code/learning/hooks.py \
            tests/learning/test_auto_reviewer.py
          uv run --no-sync ty check src/free_claude_code/learning/auto_reviewer.py
      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet -- \
            src/free_claude_code/learning/auto_reviewer.py \
            src/free_claude_code/learning/hooks.py \
            tests/learning/test_auto_reviewer.py; then
            echo "No normalization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/free_claude_code/learning/auto_reviewer.py \
            src/free_claude_code/learning/hooks.py \
            tests/learning/test_auto_reviewer.py
          git commit -m "style: normalize automatic reviewer learning"
          git push origin HEAD:feat/auto-reviewer-scar-learning
