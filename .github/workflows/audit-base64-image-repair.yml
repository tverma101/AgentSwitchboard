name: audit-base64-image-repair

on:
  push:
    branches: [fix/base64-image-preflight-bound]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: false
      - name: Apply and validate base64 preflight bound
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/free_claude_code/core/visual_attachments.py")
          text = path.read_text()
          old = """def validate_base64_source(source: dict[str, Any]) -> VisualAttachmentReceipt:\n    \"\"\"Validate an Anthropic base64 source without exposing its payload.\"\"\"\n    encoded = source.get(\"data\")\n    media_type = source.get(\"media_type\")\n    if not isinstance(encoded, str) or not isinstance(media_type, str):\n        raise VisualAttachmentError(\"Base64 image requires media_type and data\")\n    try:\n        data = base64.b64decode(encoded, validate=True)\n    except (ValueError, binascii.Error) as exc:\n        raise VisualAttachmentError(\"Image base64 is invalid\") from exc\n    return validate_image_bytes(data, media_type=media_type)\n"""
          new = """def validate_base64_source(source: dict[str, Any]) -> VisualAttachmentReceipt:\n    \"\"\"Validate an Anthropic base64 source without exposing its payload.\"\"\"\n    encoded = source.get(\"data\")\n    media_type = source.get(\"media_type\")\n    if not isinstance(encoded, str) or not isinstance(media_type, str):\n        raise VisualAttachmentError(\"Base64 image requires media_type and data\")\n    if media_type not in SUPPORTED_IMAGE_TYPES:\n        raise VisualAttachmentError(f\"Unsupported image media type: {media_type}\")\n\n    # Base64 expands three input bytes into four ASCII characters. Reject an\n    # impossible-to-fit payload before allocating its decoded copy; the\n    # decoded-byte check in validate_image_bytes remains authoritative.\n    max_encoded_chars = 4 * ((MAX_IMAGE_BYTES + 2) // 3)\n    if len(encoded) > max_encoded_chars:\n        raise VisualAttachmentError(\n            f\"Image exceeds the {MAX_IMAGE_BYTES / (1024 * 1024):g} MiB limit\"\n        )\n    try:\n        data = base64.b64decode(encoded, validate=True)\n    except (ValueError, binascii.Error) as exc:\n        raise VisualAttachmentError(\"Image base64 is invalid\") from exc\n    return validate_image_bytes(data, media_type=media_type)\n"""
          if text.count(old) != 1:
              raise RuntimeError("base64 validator anchor changed")
          path.write_text(text.replace(old, new, 1))
          PY

          cat > tests/core/test_visual_attachment_preflight_bounds.py <<'PY'
          from unittest.mock import patch

          import pytest

          from free_claude_code.core.visual_attachments import (
              MAX_IMAGE_BYTES,
              VisualAttachmentError,
              validate_base64_source,
          )


          def test_oversized_base64_is_rejected_before_decode() -> None:
              max_encoded_chars = 4 * ((MAX_IMAGE_BYTES + 2) // 3)
              source = {"media_type": "image/png", "data": "A" * (max_encoded_chars + 1)}

              with (
                  patch("free_claude_code.core.visual_attachments.base64.b64decode") as decode,
                  pytest.raises(VisualAttachmentError, match="20 MiB"),
              ):
                  validate_base64_source(source)

              decode.assert_not_called()


          def test_unsupported_media_type_is_rejected_before_decode() -> None:
              source = {"media_type": "image/gif", "data": "AAAA"}

              with (
                  patch("free_claude_code.core.visual_attachments.base64.b64decode") as decode,
                  pytest.raises(VisualAttachmentError, match="Unsupported image media type"),
              ):
                  validate_base64_source(source)

              decode.assert_not_called()
          PY

          uv sync --locked
          uv run ruff format src/free_claude_code/core/visual_attachments.py tests/core/test_visual_attachment_preflight_bounds.py
          uv run ruff check --fix src/free_claude_code/core/visual_attachments.py tests/core/test_visual_attachment_preflight_bounds.py
          uv run ty check
          uv run pytest -q -n 0 tests/core/test_visual_attachments.py tests/core/test_visual_attachment_preflight_bounds.py
          git diff --check

          git config user.name "AgentSwitchboard audit repair"
          git config user.email "audit-repair@users.noreply.github.com"
          git rm .github/workflows/audit-base64-image-repair.yml
          git add src/free_claude_code/core/visual_attachments.py tests/core/test_visual_attachment_preflight_bounds.py
          git commit -m "fix: bound base64 image input before decoding"
          git push origin HEAD:fix/base64-image-preflight-bound
