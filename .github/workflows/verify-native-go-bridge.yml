name: One-shot native Go bridge verifier

on:
  push:
    branches:
      - feat/opencode-go-native-bridge
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/opencode-go-native-bridge
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: true
      - name: Format, lint, type-check, focused test, and lock
        run: |
          uv lock
          uv run ruff format src/free_claude_code/providers/opencode_go src/free_claude_code/providers/runtime/factory.py tests/providers/test_opencode_go_native.py
          uv run ruff check --fix src/free_claude_code/providers/opencode_go src/free_claude_code/providers/runtime/factory.py tests/providers/test_opencode_go_native.py
          uv run ty check
          uv run pytest -q tests/providers/test_opencode_go_native.py tests/providers/test_opencode.py
      - name: Commit verified generated/format changes and remove verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock src/free_claude_code/providers/opencode_go src/free_claude_code/providers/runtime/factory.py tests/providers/test_opencode_go_native.py
          git rm .github/workflows/verify-native-go-bridge.yml
          git commit -m "chore: verify and normalize native Go bridge"
          git push origin HEAD:feat/opencode-go-native-bridge
