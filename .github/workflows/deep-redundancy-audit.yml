name: Deep redundancy and test audit

on:
  push:
    branches:
      - codex/redundancy-test-suite-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Audit current main plus PR
        run: |
          git config user.name "audit-runner"
          git config user.email "audit-runner@users.noreply.github.com"
          echo "PR_SHA=$(git rev-parse HEAD)"
          git fetch origin main
          echo "MAIN_SHA=$(git rev-parse origin/main)"
          git merge --no-commit --no-ff origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: false

      - name: Prepare environment
        run: uv sync --locked

      - name: Pytest strict collection
        id: strict
        continue-on-error: true
        run: uv run --no-sync pytest --strict --collect-only -q

      - name: Pytest importlib collection
        id: importlib
        continue-on-error: true
        run: uv run --no-sync pytest --import-mode=importlib --collect-only -q

      - name: Ruff pytest-style audit
        id: pytest_style
        continue-on-error: true
        run: uv run --no-sync ruff check tests --select PT --output-format concise

      - name: Ruff complexity audit
        id: complexity
        continue-on-error: true
        run: >-
          uv run --no-sync ruff check src/free_claude_code tests
          --select C901,PLR0911,PLR0912,PLR0913,PLR0915
          --output-format concise

      - name: High-confidence redundancy gate
        id: redundancy
        continue-on-error: true
        run: uv run --no-sync pytest tests/test_redundancy_audit.py -q --tb=short

      - name: Cross-file clone report
        id: clones
        continue-on-error: true
        run: |
          python - <<'PY'
          import ast
          import collections
          import hashlib
          from pathlib import Path

          roots = (Path("src/free_claude_code"), Path("tests"))
          files = sorted(
              path
              for root in roots
              for path in root.rglob("*.py")
              if "_vendor" not in path.parts
          )
          test_groups = collections.defaultdict(list)
          production_groups = collections.defaultdict(list)

          for path in files:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  if path.parts[0] == "tests" and node.name.startswith("test_"):
                      payload = (
                          type(node).__name__,
                          ast.dump(node.args, include_attributes=False),
                          tuple(ast.dump(item, include_attributes=False) for item in node.decorator_list),
                          tuple(ast.dump(item, include_attributes=False) for item in node.body),
                      )
                      digest = hashlib.sha256(repr(payload).encode()).hexdigest()
                      test_groups[digest].append((str(path), node.name, node.lineno))
                  elif path.parts[0] == "src" and len(node.body) >= 2:
                      payload = (
                          type(node).__name__,
                          ast.dump(node.args, include_attributes=False),
                          tuple(ast.dump(item, include_attributes=False) for item in node.body),
                      )
                      digest = hashlib.sha256(repr(payload).encode()).hexdigest()
                      production_groups[digest].append((str(path), node.name, node.lineno))

          test_clones = [
              items
              for items in test_groups.values()
              if len({path for path, _, _ in items}) > 1
          ]
          production_clones = [
              items for items in production_groups.values() if len(items) > 1
          ]
          for label, groups in (
              ("TEST_CLONE", test_clones),
              ("PROD_CLONE", production_clones),
          ):
              for items in sorted(groups, key=len, reverse=True)[:50]:
                  print(
                      label,
                      " | ".join(
                          f"{path}:{line}:{name}" for path, name, line in items
                      ),
                  )
          print(f"CROSS_FILE_TEST_CLONE_GROUPS={len(test_clones)}")
          print(f"PRODUCTION_FUNCTION_CLONE_GROUPS={len(production_clones)}")
          PY

      - name: Full suite with branch coverage
        id: coverage
        continue-on-error: true
        shell: bash
        run: |
          set +e
          uv run --no-sync pytest -q --tb=short --durations=30 \
            --cov=free_claude_code --cov-branch --cov-report=json:/tmp/coverage.json
          status=$?
          if [[ -f /tmp/coverage.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/coverage.json").read_text())
          totals = report["totals"]
          print("=== coverage totals ===")
          for key in (
              "percent_covered",
              "num_statements",
              "missing_lines",
              "num_branches",
              "missing_branches",
          ):
              print(f"{key}={totals.get(key)}")

          rows = []
          for path, data in report["files"].items():
              summary = data["summary"]
              statements = summary.get("num_statements", 0)
              if statements >= 20:
                  rows.append((summary.get("percent_covered", 100.0), statements, path, summary))
          print("=== lowest-covered production files (>=20 statements) ===")
          for percent, statements, path, summary in sorted(rows)[:40]:
              print(
                  f"{percent:6.2f}% {statements:5d} stmts "
                  f"{summary.get('missing_lines', 0):4d} missing lines "
                  f"{summary.get('missing_branches', 0):4d} missing branches {path}"
              )
          PY
          fi
          exit "$status"

      - name: Audit outcome summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "strict=${{ steps.strict.outcome }}"
          echo "importlib=${{ steps.importlib.outcome }}"
          echo "pytest_style=${{ steps.pytest_style.outcome }} (advisory)"
          echo "complexity=${{ steps.complexity.outcome }} (advisory)"
          echo "clones=${{ steps.clones.outcome }} (advisory)"
          echo "redundancy=${{ steps.redundancy.outcome }}"
          echo "coverage=${{ steps.coverage.outcome }}"

          failed=0
          for outcome in \
            "${{ steps.strict.outcome }}" \
            "${{ steps.importlib.outcome }}" \
            "${{ steps.redundancy.outcome }}" \
            "${{ steps.coverage.outcome }}"; do
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"
