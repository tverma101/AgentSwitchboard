name: Temporary Codex account formatter

on:
  push:
    branches: [feat/codex-subscription-accounts]

permissions:
  contents: write

jobs:
  format:
    runs-on: ${{ vars.HARNESS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/codex-subscription-accounts
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.16"
          enable-cache: false
          cache-python: false

      - name: Reuse warm Harness environment
        shell: bash
        run: |
          environment_root="$HOME/.cache/harness-actions/venvs"
          environment_path="$environment_root/${RUNNER_OS}-${RUNNER_ARCH}-py314"
          mkdir -p "$environment_root"
          echo "UV_PROJECT_ENVIRONMENT=$environment_path" >> "$GITHUB_ENV"
          export UV_PROJECT_ENVIRONMENT="$environment_path"
          uv sync --locked

      - name: Format only the new account files
        shell: bash
        run: |
          uv run --no-sync ruff format \
            src/free_claude_code/cli/codex_accounts.py \
            tests/cli/test_codex_accounts.py
          uv run --no-sync ruff check --fix \
            src/free_claude_code/cli/codex_accounts.py \
            tests/cli/test_codex_accounts.py

      - name: Commit formatter output
        shell: bash
        run: |
          git add \
            src/free_claude_code/cli/codex_accounts.py \
            tests/cli/test_codex_accounts.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Codex subscription account files"
          git push origin HEAD:feat/codex-subscription-accounts
