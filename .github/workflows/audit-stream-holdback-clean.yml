name: audit-stream-holdback-clean

on:
  push:
    branches: [fix/stream-holdback-wallclock-clean]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: false
      - name: Apply and validate wall-clock holdback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AgentSwitchboard audit repair"
          git config user.email "audit-repair@users.noreply.github.com"
          python scripts/apply_stream_holdback_repair.py
          uv sync --locked
          uv run ruff format \
            src/free_claude_code/providers/stream_recovery.py \
            src/free_claude_code/providers/openai_codex/provider.py \
            src/free_claude_code/providers/openai_chat/provider.py \
            src/free_claude_code/providers/opencode_go/provider.py \
            tests/providers/test_stream_holdback_deadline.py \
            tests/providers/test_openai_codex_holdback_deadline.py \
            tests/providers/test_openai_chat_holdback_deadline.py \
            tests/providers/test_opencode_go_holdback_deadline.py
          uv run ruff check --fix \
            src/free_claude_code/providers/stream_recovery.py \
            src/free_claude_code/providers/openai_codex/provider.py \
            src/free_claude_code/providers/openai_chat/provider.py \
            src/free_claude_code/providers/opencode_go/provider.py \
            tests/providers/test_stream_holdback_deadline.py \
            tests/providers/test_openai_codex_holdback_deadline.py \
            tests/providers/test_openai_chat_holdback_deadline.py \
            tests/providers/test_opencode_go_holdback_deadline.py
          uv run ty check
          uv run pytest -q -n 0 \
            tests/providers/test_stream_recovery.py \
            tests/providers/test_stream_holdback_deadline.py \
            tests/providers/test_openai_codex_holdback_deadline.py \
            tests/providers/test_openai_chat_holdback_deadline.py \
            tests/providers/test_opencode_go_holdback_deadline.py \
            tests/providers/test_openai_codex_provider.py \
            tests/providers/test_opencode_go_native.py \
            tests/providers/test_streaming_errors.py
          git diff --check
          git rm scripts/apply_stream_holdback_repair.py .github/workflows/audit-stream-holdback-clean.yml
          git add \
            src/free_claude_code/providers/stream_recovery.py \
            src/free_claude_code/providers/openai_codex/provider.py \
            src/free_claude_code/providers/openai_chat/provider.py \
            src/free_claude_code/providers/opencode_go/provider.py \
            tests/providers/test_stream_holdback_deadline.py \
            tests/providers/test_openai_codex_holdback_deadline.py \
            tests/providers/test_openai_chat_holdback_deadline.py \
            tests/providers/test_opencode_go_holdback_deadline.py
          git commit -m "fix: enforce stream holdback by wall clock"
          git push origin HEAD:fix/stream-holdback-wallclock-clean
