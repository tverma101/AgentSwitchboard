# Branch protection: require every status check this workflow reports, for example:
#   Ban suppressions and legacy annotations
#   ruff-format, ruff-check, ty, pytest
# GitHub may prefix with the workflow name (e.g. "CI / ruff-format"); use the names the branch protection UI offers after a run.

name: CI

env:
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: "malware-check"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Emergency runner label when the Mac runner is overloaded
        required: false
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - harness-burst
          - harness-local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-suppressions-or-legacy-annotations:
    name: Ban suppressions and legacy annotations
    # Never execute fork-controlled code on the persistent self-hosted runner.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.HARNESS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: "Fail on type ignores and legacy future annotations"
        run: |
          if grep -rE '# type: ignore|# ty: ignore|from __future__ import annotations' --include='*.py' . --exclude-dir=.venv --exclude-dir=.git; then
            echo "::error::type: ignore / ty: ignore comments and legacy future annotations are not allowed. Fix the underlying type/import issue instead."
            exit 1
          fi
          exit 0

  quality:
    name: ${{ matrix.id }}
    # Never execute fork-controlled code on the persistent self-hosted runner.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.HARNESS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ruff-format
            run: uv run --no-sync ruff format --check
          - id: ruff-check
            run: uv run --no-sync ruff check
          - id: ty
            run: uv run --no-sync ty check
          - id: pytest
            run: uv run --no-sync pytest -v --tb=short
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: true

      - name: Reuse warm Harness environment
        shell: bash
        run: |
          environment_root="$HOME/.cache/harness-actions/venvs"
          environment_path="$environment_root/${RUNNER_OS}-${RUNNER_ARCH}-py314"
          echo "UV_PROJECT_ENVIRONMENT=$environment_path" >> "$GITHUB_ENV"
          export UV_PROJECT_ENVIRONMENT="$environment_path"
          uv sync --locked

      - name: Run
        run: ${{ matrix.run }}
