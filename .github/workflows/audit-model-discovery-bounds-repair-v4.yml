name: Audit model discovery bounds repair v4

on:
  push:
    branches: [fix/bound-provider-model-discovery]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/bound-provider-model-discovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: false
      - name: Patch bounded model discovery
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/audit-model-discovery-bounds-repair-v3.yml").read_text(encoding="utf-8")
          marker = "      - name: Patch bounded model discovery\n        shell: python\n        run: |\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("      - name: Validate\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, "<bounds-repair-v3>", "exec"))

          cloudflare = Path("src/free_claude_code/providers/cloudflare/client.py")
          text = cloudflare.read_text(encoding="utf-8")
          old = '''from free_claude_code.providers.model_listing import (
              ModelListResponseError,
              extract_openai_model_infos,
          )'''
          new = "from free_claude_code.providers.model_listing import extract_openai_model_infos"
          assert text.count(old) == 1, "Cloudflare model-list import anchor changed"
          cloudflare.write_text(text.replace(old, new), encoding="utf-8")
      - name: Validate
        run: |
          uv sync --locked
          uv run --no-sync ruff format \
            src/free_claude_code/providers/model_listing.py \
            src/free_claude_code/providers/http.py \
            src/free_claude_code/providers/cloudflare/client.py \
            src/free_claude_code/providers/github_models/client.py \
            src/free_claude_code/providers/vertex/client.py \
            src/free_claude_code/providers/vertex/models.py \
            src/free_claude_code/providers/opencode_go/provider.py \
            src/free_claude_code/providers/openai_codex/provider.py \
            tests/providers/test_cloudflare.py \
            tests/providers/test_github_models.py \
            tests/providers/test_vertex.py \
            tests/providers/test_native_model_discovery_egress.py \
            tests/providers/test_model_list_bounds.py
          uv run --no-sync ruff check \
            src/free_claude_code/providers/model_listing.py \
            src/free_claude_code/providers/http.py \
            src/free_claude_code/providers/cloudflare/client.py \
            src/free_claude_code/providers/github_models/client.py \
            src/free_claude_code/providers/vertex/client.py \
            src/free_claude_code/providers/vertex/models.py \
            src/free_claude_code/providers/opencode_go/provider.py \
            src/free_claude_code/providers/openai_codex/provider.py \
            tests/providers/test_cloudflare.py \
            tests/providers/test_github_models.py \
            tests/providers/test_vertex.py \
            tests/providers/test_native_model_discovery_egress.py \
            tests/providers/test_model_list_bounds.py
          uv run --no-sync ty check
          uv run --no-sync pytest -q --tb=short \
            tests/providers/test_model_list_bounds.py \
            tests/providers/test_model_listing_metadata.py \
            tests/providers/test_cloudflare.py \
            tests/providers/test_github_models.py \
            tests/providers/test_vertex.py \
            tests/providers/test_native_model_discovery_egress.py \
            tests/providers/test_openai_codex_provider.py \
            tests/providers/test_openai_codex_egress_policy.py \
            tests/providers/test_opencode_go_provider.py
      - name: Commit clean repair
        run: |
          rm .github/workflows/audit-model-discovery-bounds-repair.yml
          rm .github/workflows/audit-model-discovery-bounds-repair-v2.yml
          rm .github/workflows/audit-model-discovery-bounds-repair-v3.yml
          rm .github/workflows/audit-model-discovery-bounds-repair-v4.yml
          git config user.name "Tejas Verma"
          git config user.email "145865683+tverma101@users.noreply.github.com"
          git add src tests .github/workflows/audit-model-discovery-bounds-repair.yml .github/workflows/audit-model-discovery-bounds-repair-v2.yml .github/workflows/audit-model-discovery-bounds-repair-v3.yml .github/workflows/audit-model-discovery-bounds-repair-v4.yml
          git commit -m "fix: bound provider model discovery"
          git push origin HEAD:fix/bound-provider-model-discovery
