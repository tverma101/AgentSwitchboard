name: audit-router-repair

on:
  push:
    branches: [fix/router-custom-gateway-context]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: false
      - name: Apply audited router repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/free_claude_code/application/routing.py")
          text = path.read_text()

          old = """from free_claude_code.config.provider_catalog import (\n    PROVIDER_CATALOG,\n    SUPPORTED_PROVIDER_IDS,\n)\n"""
          new = """from free_claude_code.config.custom_providers import provider_registry_for_settings\n"""
          if text.count(old) != 1:
              raise RuntimeError("provider catalog import anchor changed")
          text = text.replace(old, new, 1)

          old = """    def __init__(self, settings: Settings):\n        self._settings = settings\n        self._model_aliases = parse_model_aliases(\n"""
          new = """    def __init__(self, settings: Settings):\n        self._settings = settings\n        self._provider_catalog = provider_registry_for_settings(settings).catalog\n        self._model_aliases = parse_model_aliases(\n"""
          if text.count(old) != 1:
              raise RuntimeError("ModelRouter init anchor changed")
          text = text.replace(old, new, 1)

          old = """        if direct_provider_id is not None and direct_provider_model is not None:\n            if force_ultracode:\n"""
          new = """        if direct_provider_id is not None and direct_provider_model is not None:\n            provider_model_ref = f\"{direct_provider_id}/{direct_provider_model}\"\n            if force_ultracode:\n"""
          if text.count(old) != 1:
              raise RuntimeError("direct route anchor changed")
          text = text.replace(old, new, 1)

          old = """                virtual_context_window = self._model_context_windows.get(\n                    requested_model\n                )\n"""
          new = """                virtual_context_window = self._model_context_windows.get(\n                    provider_model_ref\n                )\n"""
          if text.count(old) != 1:
              raise RuntimeError("direct context lookup anchor changed")
          text = text.replace(old, new, 1)

          old = "                provider_model_ref=requested_model,\n"
          new = "                provider_model_ref=provider_model_ref,\n"
          if text.count(old) != 1:
              raise RuntimeError("direct provider_model_ref anchor changed")
          text = text.replace(old, new, 1)

          old = """    @staticmethod\n    def _validate_provider_id(provider_id: str) -> None:\n        if provider_id not in PROVIDER_CATALOG:\n            raise UnknownProviderError.for_provider(provider_id, PROVIDER_CATALOG)\n\n    def _direct_provider_model(\n        self, model_name: str\n"""
          if old not in text:
              old = """    @staticmethod\n    def _validate_provider_id(provider_id: str) -> None:\n        if provider_id not in PROVIDER_CATALOG:\n            raise UnknownProviderError.for_provider(provider_id, PROVIDER_CATALOG)\n\n    @staticmethod\n    def _direct_provider_model(\n        model_name: str\n"""
          new = """    def _validate_provider_id(self, provider_id: str) -> None:\n        if provider_id not in self._provider_catalog:\n            raise UnknownProviderError.for_provider(provider_id, self._provider_catalog)\n\n    def _direct_provider_model(\n        self, model_name: str\n"""
          else:
              new = """    def _validate_provider_id(self, provider_id: str) -> None:\n        if provider_id not in self._provider_catalog:\n            raise UnknownProviderError.for_provider(provider_id, self._provider_catalog)\n\n    def _direct_provider_model(\n        self, model_name: str\n"""
          if text.count(old) != 1:
              raise RuntimeError("provider validation/direct method anchor changed")
          text = text.replace(old, new, 1)

          if text.count("decoded.provider_id not in SUPPORTED_PROVIDER_IDS") != 1:
              raise RuntimeError("decoded provider guard anchor changed")
          text = text.replace(
              "decoded.provider_id not in SUPPORTED_PROVIDER_IDS",
              "decoded.provider_id not in self._provider_catalog",
              1,
          )
          if text.count("provider_id not in SUPPORTED_PROVIDER_IDS") != 1:
              raise RuntimeError("literal provider guard anchor changed")
          text = text.replace(
              "provider_id not in SUPPORTED_PROVIDER_IDS",
              "provider_id not in self._provider_catalog",
              1,
          )
          path.write_text(text)

          tests = Path("tests/application/test_routing.py")
          text = tests.read_text()

          def replace_in_test(name: str, old: str, new: str) -> None:
              global text
              start = text.index(f"def {name}(")
              end = text.find("\ndef ", start + 1)
              if end == -1:
                  end = len(text)
              block = text[start:end]
              if block.count(old) != 1:
                  raise RuntimeError(f"test anchor changed: {name}")
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]

          replace_in_test(
              "test_model_router_routes_gateway_encoded_provider_model_directly",
              """    assert (\n        routed.resolved.provider_model_ref\n        == \"anthropic/nvidia_nim/deepseek-ai/deepseek-v4-pro\"\n    )\n""",
              """    assert (\n        routed.resolved.provider_model_ref\n        == \"nvidia_nim/deepseek-ai/deepseek-v4-pro\"\n    )\n""",
          )
          replace_in_test(
              "test_model_router_routes_ultra_gateway_model_with_ultracode_effort",
              """    assert (\n        routed.resolved.provider_model_ref\n        == \"claude-3-freecc-ultra/nvidia_nim/deepseek-ai/deepseek-v4-pro\"\n    )\n""",
              """    assert (\n        routed.resolved.provider_model_ref\n        == \"nvidia_nim/deepseek-ai/deepseek-v4-pro\"\n    )\n""",
          )

          addition = r'''


def test_model_router_routes_enabled_custom_provider_directly(settings):
    custom_settings = settings.model_copy(
        update={
            "custom_providers_json": (
                '{"providers":[{"id":"custom-lane","display_name":"Custom Lane",'
                '"base_url":"http://localhost:9000/v1","local":true,'
                '"models":["model-x"],"enabled":true}]}'
            )
        }
    )
    router = ModelRouter(custom_settings)

    direct = router.resolve("custom_lane/model-x")
    gateway = router.resolve("anthropic/custom_lane/model-x")

    assert direct.provider_id == "custom_lane"
    assert direct.provider_model == "model-x"
    assert direct.provider_model_ref == "custom_lane/model-x"
    assert gateway.provider_id == "custom_lane"
    assert gateway.provider_model == "model-x"
    assert gateway.provider_model_ref == "custom_lane/model-x"


def test_gateway_model_uses_canonical_manual_context_window(settings):
    settings = settings.model_copy(
        update={
            "model_context_windows": (
                '{"nvidia_nim/deepseek-ai/deepseek-v4-pro": 777777}'
            )
        }
    )

    resolved = ModelRouter(settings).resolve(
        "anthropic/nvidia_nim/deepseek-ai/deepseek-v4-pro"
    )

    assert resolved.provider_model_ref == "nvidia_nim/deepseek-ai/deepseek-v4-pro"
    assert resolved.virtual_context_window == 777_777
'''
          if "def test_model_router_routes_enabled_custom_provider_directly(" in text:
              raise RuntimeError("custom provider regression test already exists")
          tests.write_text(text.rstrip() + addition + "\n")
          PY

          uv sync --locked
          uv run ruff format src/free_claude_code/application/routing.py tests/application/test_routing.py
          uv run ruff check --fix src/free_claude_code/application/routing.py tests/application/test_routing.py
          uv run ty check
          uv run pytest -q -n 0 tests/application/test_routing.py tests/config/test_custom_providers.py tests/providers/test_custom_provider_runtime.py
          git diff --check

          git config user.name "AgentSwitchboard audit repair"
          git config user.email "audit-repair@users.noreply.github.com"
          git rm .github/workflows/audit-router-repair.yml
          git add src/free_claude_code/application/routing.py tests/application/test_routing.py
          git commit -m "fix: route custom and gateway models canonically"
          git push origin HEAD:fix/router-custom-gateway-context
