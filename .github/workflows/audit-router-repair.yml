name: audit-router-repair

on:
  push:
    branches:
      - "fix/router-custom-gateway-context"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: false
      - name: Apply and validate repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_router_repair.py
          uv sync --locked
          uv run ruff format src/free_claude_code/application/routing.py tests/application/test_routing.py
          uv run ruff check --fix src/free_claude_code/application/routing.py tests/application/test_routing.py
          uv run ty check
          uv run pytest -q -n 0 tests/application/test_routing.py tests/config/test_custom_providers.py tests/providers/test_custom_provider_runtime.py
          git diff --check
          git config user.name "AgentSwitchboard audit repair"
          git config user.email "audit-repair@users.noreply.github.com"
          git rm .github/workflows/audit-router-repair.yml scripts/audit_router_repair.py
          git add src/free_claude_code/application/routing.py tests/application/test_routing.py
          git commit -m "fix: route custom and gateway models canonically"
          git push origin HEAD:fix/router-custom-gateway-context
