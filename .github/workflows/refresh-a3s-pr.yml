name: refresh-a3s-pr

on:
  push:
    branches: [fix/a3s-subprocess-lifecycle]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.16"
          enable-cache: true
          cache-python: false
      - name: Merge current main and validate A3S lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AgentSwitchboard audit repair"
          git config user.email "audit-repair@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          uv sync --locked
          uv run ruff format --check src/free_claude_code/api/web_tools/local_search.py tests/api/test_local_a3s_search.py
          uv run ruff check src/free_claude_code/api/web_tools/local_search.py tests/api/test_local_a3s_search.py
          uv run ty check
          uv run pytest -q -n 0 tests/api/test_local_a3s_search.py
          git diff --check origin/main...HEAD
          git rm .github/workflows/refresh-a3s-pr.yml
          git commit -m "chore: validate A3S lifecycle fix on current main"
          git push origin HEAD:fix/a3s-subprocess-lifecycle
